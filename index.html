/* ---------- Tokens de diseño (igual que el prototipo) ---------- */
const COLORS = {

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const pad = (n) => String(n).padStart(2, "0");

const CURRENT_YEAR = now.getFullYear();

function shiftMonth(mes, anio, offset) {
  let m = mes + offset, y = anio;
  while (m < 1) { m += 12; y -= 1; }
  while (m > 12) { m -= 12; y += 1; }
  return { mes: m, anio: y };
}

}

/* ---------- Lógica de negocio (igual que el prototipo) ---------- */
function pagosEfectivos(socio, socios) {
  if (socio.tipo === "Grupal" && !socio.esTitular) {
    const titular = socios.find((s) => s.grupoId === socio.grupoId && s.esTitular);
    return titular ? titular.pagos : socio.pagos;
  }
  return socio.pagos;
}
function listaDeGrupos(socios) {
  const titulares = socios.filter((s) => s.tipo === "Grupal" && s.esTitular && s.estado === "Activo");
  return titulares.map((t) => ({
    grupoId: t.grupoId,
    grupoNombre: t.grupoNombre,
    cuota: t.cuota,
    integrantes: socios.filter((s) => s.grupoId === t.grupoId && s.estado === "Activo").length,
  }));
}
function estadoCuota(socio, socios) {
  if (socio.eximido) return { estado: "Eximido", meses: 0, mesesLista: [], color: COLORS.exento, bg: COLORS.exentoLight };
  const pagos = pagosEfectivos(socio, socios);
  const set = new Set(pagos.map((p) => `${p.anio}-${p.mes}`));
  const pagado = (mes, anio) => set.has(`${anio}-${mes}`);
  // Se usa la fecha real de carga en el sistema (no la fecha de alta, que es editable
  // y puede ser histórica) para no generar deuda retroactiva por meses previos a la carga.
  const alta = new Date(socio.createdAt || socio.fechaAlta);
  const altaYM = alta.getFullYear() * 12 + alta.getMonth();
  let meses = 0;
  const mesesLista = [];
  let cur = shiftMonth(CURRENT_MONTH, CURRENT_YEAR, -1);
  for (let i = 0; i < 12; i++) {
    const curYM = cur.anio * 12 + (cur.mes - 1);
    if (curYM < altaYM) break;
    if (!pagado(cur.mes, cur.anio)) { meses++; mesesLista.push({ mes: cur.mes, anio: cur.anio }); }
    cur = shiftMonth(cur.mes, cur.anio, -1);
  }
  mesesLista.reverse();
  if (meses > 0) return { estado: "Deudor", meses, mesesLista, color: COLORS.red, bg: COLORS.redLight };
  if (pagado(CURRENT_MONTH, CURRENT_YEAR)) return { estado: "Al día", meses: 0, mesesLista: [], color: COLORS.green, bg: COLORS.greenLight };
  if (CURRENT_DAY <= 10) return { estado: "Al día", meses: 0, mesesLista: [], color: COLORS.green, bg: COLORS.greenLight };
  return { estado: "Pendiente", meses: 0, mesesLista: [], color: COLORS.amber, bg: COLORS.amberLight };
}
function formatMesesLista(lista) {
  const nombres = lista.map((m) => cap(MESES[m.mes - 1]) + (m.anio !== CURRENT_YEAR ? ` ${m.anio}` : ""));
  if (nombres.length === 0) return "";
  if (nombres.length === 1) return nombres[0];
  return nombres.slice(0, -1).join(", ") + " y " + nombres[nombres.length - 1];
}
// Calcula los próximos N meses a pagar, saltando los que ya están pagados.
// Si el socio debe meses anteriores, esos se cubren primero; si está al día,
// sigue de largo hacia meses futuros (pago por adelantado).
function proximosMesesAPagar(socio, socios, cantidad) {
  const pagos = pagosEfectivos(socio, socios);
  const pagadoSet = new Set(pagos.map((p) => `${p.anio}-${p.mes}`));
  const pagado = (mes, anio) => pagadoSet.has(`${anio}-${mes}`);
  const alta = new Date(socio.createdAt || socio.fechaAlta);
  let cursor = { mes: alta.getMonth() + 1, anio: alta.getFullYear() };
  const resultado = [];
  let i = 0;
  while (resultado.length < cantidad && i < 240) {
    if (!pagado(cursor.mes, cursor.anio)) resultado.push({ mes: cursor.mes, anio: cursor.anio });
    cursor = shiftMonth(cursor.mes, cursor.anio, 1);
    i++;
  }
  return resultado;
}
function iconoEstado(estado) {
  if (estado === "Al día") return CheckCircle2;
  if (estado === "Pendiente") return Clock;
  if (estado === "Eximido") return ShieldCheck;
  return AlertTriangle;
}

/* ---------- Login ---------- */
function LoginScreen({ notify }) {
  const [modo, setModo] = useState("login"); // "login" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [cargando, setCargando] = useState(false);
  const [avisoConfirmacion, setAvisoConfirmacion] = useState(false);

  const entrar = async () => {
    if (!email || !password) { notify("Completá el mail y la contraseña."); return; }
    setCargando(true);
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    setCargando(false);
    if (error) notify("No pudimos ingresar: " + error.message);
  };

  const crearCuenta = async () => {
    if (!email || !password) { notify("Completá el mail y la contraseña."); return; }
    if (password.length < 6) { notify("La contraseña tiene que tener al menos 6 caracteres."); return; }
    setCargando(true);
    const { data, error } = await supabase.auth.signUp({ email, password });
    setCargando(false);
    if (error) { notify("No pudimos crear la cuenta: " + error.message); return; }
    if (!data.session) setAvisoConfirmacion(true);
  };

  if (avisoConfirmacion) {
    return (
      <div style={{ minHeight: "100vh", background: `linear-gradient(180deg, ${COLORS.navy}, ${COLORS.navyDark})`, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 28, fontFamily: BODY_FONT, textAlign: "center" }}>

        <div style={{ color: "rgba(255,255,255,0.75)", fontSize: 13.5, marginTop: 8, maxWidth: 280 }}>

        <button onClick={() => setAvisoConfirmacion(false)} style={{ marginTop: 20, color: COLORS.green, fontWeight: 700, background: "none", border: "none" }}>Volver</button>
      </div>
    );

  return (
    <div style={{ minHeight: "100vh", background: `linear-gradient(180deg, ${COLORS.navy}, ${COLORS.navyDark})`, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 28, fontFamily: BODY_FONT }}>

        <div className="flex gap-2" style={{ marginBottom: 16 }}>

          <button onClick={() => setModo("signup")} style={{ flex: 1, padding: "9px 0", borderRadius: 8, fontWeight: 700, fontSize: 13, background: modo === "signup" ? COLORS.green : "rgba(255,255,255,0.1)", color: "#fff", border: "none" }}>Crear cuenta</button>

function VincularScreen({ onVinculado, onSalir, notify }) {
  const [socioId, setSocioId] = useState("");
  const [dni, setDni] = useState("");
  const [cargando, setCargando] = useState(false);

  const vincular = async () => {
    if (!socioId || !dni) { notify("Completá tu número de socio y tu DNI."); return; }
    setCargando(true);
    const { data, error } = await supabase.rpc("vincular_socio", { p_socio_id: Number(socioId), p_dni: dni });
    setCargando(false);
    if (error) { notify("Error: " + error.message); return; }
    if (!data.ok) { notify(data.error); return; }
    notify("¡Cuenta vinculada!");
    await onVinculado();
  };

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 28, fontFamily: BODY_FONT }}>
      <Crest size={72} />

        Ingresá tu número de socio y tu DNI, tal como están registrados en el club.
      </div>
      <div style={{ width: "100%", maxWidth: 320 }}>
        <Field label="Número de socio"><input type="number" style={inputStyle} value={socioId} onChange={(e) => setSocioId(e.target.value)} /></Field>
        <div style={{ height: 10 }} />
        <Field label="DNI"><input style={inputStyle} value={dni} onChange={(e) => setDni(e.target.value)} /></Field>
        <button disabled={cargando} onClick={vincular} className="w-full" style={{ marginTop: 16, background: COLORS.navy, color: "#fff", fontWeight: 700, padding: "13px 0", borderRadius: 12, border: "none", opacity: cargando ? 0.7 : 1 }}>

}

function AdminDashboard({ socios, onOpenNotif, onCompose, onExit }) {
  const activos = socios.filter((s) => s.estado === "Activo");
  const conteo = { "Al día": 0, "Pendiente": 0, "Deudor": 0 };
  activos.forEach((s) => { const e = estadoCuota(s, socios).estado; if (conteo[e] !== undefined) conteo[e]++; });

  const pagosRecientes = [];
  activos.forEach((s) => {
    if (s.tipo === "Grupal" && !s.esTitular) return;
    s.pagos.forEach((p) => pagosRecientes.push({ ...p, nombre: s.tipo === "Grupal" ? s.grupoNombre : `${s.nombre} ${s.apellido}` }));
  });
  pagosRecientes.sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  const ultimos = pagosRecientes.slice(0, 5);

  const stats = [
    { label: "Socios activos", value: activos.length, color: COLORS.navy },
    { label: "Al día", value: conteo["Al día"], color: COLORS.green },
    { label: "Pendientes", value: conteo["Pendiente"], color: COLORS.amber },
    { label: "Deudores", value: conteo["Deudor"], color: COLORS.red },
  ];

  return (
    <div style={{ paddingBottom: 12 }}>
      <TopHeader
        title="Hola, Admin"
        subtitle={`${cap(MESES[CURRENT_MONTH - 1])} ${CURRENT_YEAR}`}
        right={
          <div className="flex items-center gap-3">
            <button onClick={onCompose} style={{ color: "#fff", background: "none", border: "none" }}><Send size={20} /></button>
            <button onClick={onOpenNotif} style={{ color: "#fff", background: "none", border: "none" }}><Bell size={22} /></button>
            <button onClick={onExit} style={{ color: "#fff", background: "none", border: "none" }}><LogOut size={19} /></button>
          </div>
        }
      />
      <div className="grid grid-cols-2 gap-3 p-4">
        {stats.map((s) => (
          <div key={s.label} style={{ background: COLORS.surface, borderLeft: `5px solid ${s.color}`, borderRadius: 12, padding: 14 }}>
            <div style={{ fontFamily: DISPLAY_FONT, fontSize: 30, fontWeight: 700, color: COLORS.text, lineHeight: 1 }}>{s.value}</div>
            <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginTop: 4 }}>{s.label}</div>
          </div>
        ))}
      </div>
      <div className="px-4">
        <div style={{ fontFamily: DISPLAY_FONT, fontSize: 18, fontWeight: 700, color: COLORS.text, marginBottom: 8 }}>Últimos pagos</div>
        <div style={{ background: COLORS.surface, borderRadius: 12, overflow: "hidden" }}>
          {ultimos.length === 0 && <div className="p-4" style={{ color: COLORS.textMuted, fontSize: 13 }}>Todavía no hay pagos registrados.</div>}
          {ultimos.map((p, i) => (
            <div key={i} className="flex items-center justify-between px-4 py-3" style={{ borderBottom: i < ultimos.length - 1 ? `1px solid ${COLORS.border}` : "none" }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.text }}>{p.nombre}</div>
                <div style={{ fontSize: 11.5, color: COLORS.textMuted }}>{cap(MESES[p.mes - 1])} {p.anio} · {p.medio} · {formatFechaISO(p.fecha)}</div>
              </div>
              <div style={{ fontFamily: DISPLAY_FONT, fontWeight: 700, color: COLORS.navy }}>{formatMoney(p.monto)}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- ADMIN: Nuevo socio ---------- */
function NuevoSocioModal({ socios, cuotaConfig, onClose, notify, onChanged }) {
  const nextId = socios.length ? Math.max(...socios.map((s) => s.id)) + 1 : 1;
  const [form, setForm] = useState({ id: nextId, nombre: "", apellido: "", dni: "", whatsapp: "", domicilio: "", tipo: "Individual", grupoNombre: "", fechaAlta: new Date().toISOString().slice(0, 10), cuota: cuotaConfig.Individual, eximido: false });
  const [modoGrupo, setModoGrupo] = useState("nuevo"); // "nuevo" | "existente"
  const [grupoElegido, setGrupoElegido] = useState("");
  const [guardando, setGuardando] = useState(false);

  const grupos = listaDeGrupos(socios);
  const gruposConLugar = grupos.filter((g) => g.integrantes < 4);

  const onTipoChange = (tipo) => setForm({ ...form, tipo, cuota: cuotaConfig[tipo] });

  const submit = async () => {
    if (!form.nombre || !form.apellido || !form.dni) { notify("Completá al menos nombre, apellido y DNI."); return; }
    if (form.tipo === "Grupal" && modoGrupo === "nuevo" && !form.grupoNombre) { notify("Ponele un nombre al grupo."); return; }
    if (form.tipo === "Grupal" && modoGrupo === "existente" && !grupoElegido) { notify("Elegí a qué grupo sumarlo."); return; }

    let grupoId = null, esTitular = false, grupoNombre = null, cuota = Number(form.cuota);
    if (form.tipo === "Grupal") {
      if (modoGrupo === "nuevo") {
        grupoId = `g${form.id}`; esTitular = true; grupoNombre = form.grupoNombre; cuota = Number(form.cuota);
      } else {
        const g = grupos.find((x) => x.grupoId === grupoElegido);
        if (!g) { notify("Ese grupo ya no está disponible."); return; }
        if (g.integrantes >= 4) { notify("Ese grupo ya tiene 4 integrantes (el máximo permitido)."); return; }
        grupoId = g.grupoId; esTitular = false; grupoNombre = g.grupoNombre; cuota = g.cuota;
      }
    }

    setGuardando(true);
    const { error } = await supabase.from("socios").insert({
      id: Number(form.id), nombre: form.nombre, apellido: form.apellido, dni: form.dni,
      whatsapp: form.whatsapp, domicilio: form.domicilio, tipo: form.tipo, cuota,
      estado: "Activo", grupo_id: grupoId, es_titular: esTitular, grupo_nombre: grupoNombre,
      fecha_alta: form.fechaAlta, eximido: !!form.eximido,
    });
    if (error) { setGuardando(false); notify("Error: " + error.message); return; }
    await supabase.from("historial_tipo").insert({ socio_id: Number(form.id), tipo: form.tipo, desde: form.fechaAlta });
    setGuardando(false);
    notify(`Socio ${form.nombre} ${form.apellido} creado con N° ${form.id}.`);
    await onChanged();
    onClose();
  };

  return (
    <Modal title="Nuevo socio" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <Field label="N° de socio (editable en modo prueba)"><input type="number" style={inputStyle} value={form.id} onChange={(e) => setForm({ ...form, id: e.target.value })} /></Field>
        <div className="flex gap-3">
          <Field label="Nombre"><input style={inputStyle} value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} /></Field>
          <Field label="Apellido"><input style={inputStyle} value={form.apellido} onChange={(e) => setForm({ ...form, apellido: e.target.value })} /></Field>
        </div>
        <Field label="DNI"><input style={inputStyle} value={form.dni} onChange={(e) => setForm({ ...form, dni: e.target.value })} /></Field>
        <Field label="WhatsApp"><input style={inputStyle} value={form.whatsapp} onChange={(e) => setForm({ ...form, whatsapp: e.target.value })} /></Field>
        <Field label="Domicilio"><input style={inputStyle} value={form.domicilio} onChange={(e) => setForm({ ...form, domicilio: e.target.value })} /></Field>
        <Field label="Tipo de socio">
          <select style={inputStyle} value={form.tipo} onChange={(e) => onTipoChange(e.target.value)}>
            <option>Individual</option><option>Grupal</option><option>Adherente</option>
          </select>
        </Field>

        {form.tipo === "Grupal" && (
          <div style={{ background: COLORS.bg, borderRadius: 10, padding: 12 }}>
            <div className="flex gap-2" style={{ marginBottom: 10 }}>
              <button onClick={() => setModoGrupo("nuevo")} style={{ flex: 1, padding: "8px 0", borderRadius: 8, fontWeight: 700, fontSize: 12.5, background: modoGrupo === "nuevo" ? COLORS.navy : COLORS.surface, color: modoGrupo === "nuevo" ? "#fff" : COLORS.text, border: `1px solid ${modoGrupo === "nuevo" ? COLORS.navy : COLORS.border}` }}>Nuevo grupo</button>
              <button onClick={() => setModoGrupo("existente")} style={{ flex: 1, padding: "8px 0", borderRadius: 8, fontWeight: 700, fontSize: 12.5, background: modoGrupo === "existente" ? COLORS.navy : COLORS.surface, color: modoGrupo === "existente" ? "#fff" : COLORS.text, border: `1px solid ${modoGrupo === "existente" ? COLORS.navy : COLORS.border}` }}>Sumar a un grupo</button>
            </div>

            {modoGrupo === "nuevo" ? (
              <Field label="Nombre del grupo (ej: Familia Pérez)"><input style={inputStyle} value={form.grupoNombre} onChange={(e) => setForm({ ...form, grupoNombre: e.target.value })} /></Field>
            ) : gruposConLugar.length === 0 ? (
              <div style={{ fontSize: 12.5, color: COLORS.textMuted }}>Todavía no hay ningún grupo con lugar disponible. Creá uno nuevo primero.</div>
            ) : (
              <Field label="Elegir grupo">
                <select style={inputStyle} value={grupoElegido} onChange={(e) => setGrupoElegido(e.target.value)}>
                  <option value="">Seleccioná un grupo...</option>
                  {gruposConLugar.map((g) => (
                    <option key={g.grupoId} value={g.grupoId}>{g.grupoNombre} ({g.integrantes}/4 integrantes)</option>
                  ))}
                </select>
              </Field>
            )}
            {modoGrupo === "existente" && grupoElegido && (
              <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 6 }}>Este socio no será titular: la cuota del grupo se sigue cobrando a nombre de quien ya es titular.</div>
            )}
          </div>
        )}

        <div className="flex gap-3">
          <Field label="Fecha de alta"><input type="date" style={inputStyle} value={form.fechaAlta} onChange={(e) => setForm({ ...form, fechaAlta: e.target.value })} /></Field>
          <Field label="Cuota"><input type="number" style={inputStyle} value={form.cuota} onChange={(e) => setForm({ ...form, cuota: e.target.value })} disabled={form.tipo === "Grupal" && modoGrupo === "existente"} /></Field>
        </div>
        <label className="flex items-center gap-2" style={{ fontSize: 13, fontWeight: 600 }}>
          <input type="checkbox" checked={form.eximido} onChange={(e) => setForm({ ...form, eximido: e.target.checked })} />
          Eximido de cuota (no se le cobra ni genera deuda)
        </label>
        <button disabled={guardando} onClick={submit} style={{ background: COLORS.navy, color: "#fff", fontWeight: 700, padding: "12px 0", borderRadius: 10, border: "none", marginTop: 6, opacity: guardando ? 0.6 : 1 }}>
          {guardando ? "Creando..." : "Crear socio"}
        </button>
      </div>
    </Modal>
  );
}

/* ---------- ADMIN: Detalle de socio ---------- */
function SocioDetail({ socio, socios, onBack, notify, onChanged }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ dni: socio.dni, whatsapp: socio.whatsapp, domicilio: socio.domicilio, tipo: socio.tipo, cuota: socio.cuota, fechaAlta: socio.fechaAlta, eximido: socio.eximido });
  const [modoGrupo, setModoGrupo] = useState("nuevo");
  const [grupoElegido, setGrupoElegido] = useState("");
  const [grupoNombreNuevo, setGrupoNombreNuevo] = useState("");
  const [showBaja, setShowBaja] = useState(false);
  const [showPago, setShowPago] = useState(false);

  const info = estadoCuota(socio, socios);
  const integrantes = socio.grupoId ? socios.filter((s) => s.grupoId === socio.grupoId) : [];
  const titular = integrantes.find((i) => i.esTitular);
  const pasandoAGrupal = form.tipo === "Grupal" && socio.tipo !== "Grupal";
  const gruposConLugar = listaDeGrupos(socios).filter((g) => g.integrantes < 4);

  const guardar = async () => {
    const cambios = [];
    const hoy = new Date().toISOString().slice(0, 10);
    if (form.dni !== socio.dni) cambios.push({ socio_id: socio.id, fecha: hoy, campo: "DNI", anterior: socio.dni, nuevo: form.dni });
    if (form.whatsapp !== socio.whatsapp) cambios.push({ socio_id: socio.id, fecha: hoy, campo: "WhatsApp", anterior: socio.whatsapp, nuevo: form.whatsapp });
    if (form.domicilio !== socio.domicilio) cambios.push({ socio_id: socio.id, fecha: hoy, campo: "Domicilio", anterior: socio.domicilio, nuevo: form.domicilio });
    if (!!form.eximido !== !!socio.eximido) cambios.push({ socio_id: socio.id, fecha: hoy, campo: "Eximido de cuota", anterior: socio.eximido ? "Sí" : "No", nuevo: form.eximido ? "Sí" : "No" });
    if (form.fechaAlta !== socio.fechaAlta) cambios.push({ socio_id: socio.id, fecha: hoy, campo: "Fecha de alta", anterior: formatFechaISO(socio.fechaAlta), nuevo: formatFechaISO(form.fechaAlta) });

    const payload = { dni: form.dni, whatsapp: form.whatsapp, domicilio: form.domicilio, tipo: form.tipo, fecha_alta: form.fechaAlta, eximido: !!form.eximido };

    if (pasandoAGrupal) {
      if (modoGrupo === "nuevo") {
        if (!grupoNombreNuevo) { notify("Ponele un nombre al grupo."); return; }
        payload.grupo_id = `g${socio.id}`; payload.es_titular = true; payload.grupo_nombre = grupoNombreNuevo; payload.cuota = Number(form.cuota);
      } else {
        const g = gruposConLugar.find((x) => x.grupoId === grupoElegido);
        if (!g) { notify("Elegí a qué grupo sumarlo."); return; }
        payload.grupo_id = g.grupoId; payload.es_titular = false; payload.grupo_nombre = g.grupoNombre; payload.cuota = g.cuota;
      }
    } else {
      payload.cuota = Number(form.cuota);
    }
    if (Number(payload.cuota) !== socio.cuota) cambios.push({ socio_id: socio.id, fecha: hoy, campo: "Cuota", anterior: formatMoney(socio.cuota), nuevo: formatMoney(payload.cuota) });

    const { error } = await supabase.from("socios").update(payload).eq("id", socio.id);
    if (error) { notify("Error: " + error.message); return; }
    if (form.tipo !== socio.tipo) {
      cambios.push({ socio_id: socio.id, fecha: hoy, campo: "Tipo de socio", anterior: socio.tipo, nuevo: form.tipo });
      await supabase.from("historial_tipo").insert({ socio_id: socio.id, tipo: form.tipo, desde: hoy });
    }
    if (cambios.length) await supabase.from("historial_cambios").insert(cambios);
    notify("Datos del socio actualizados.");
    setEditing(false);
    await onChanged();
  };

  const confirmarBaja = async () => {
    const hoy = new Date().toISOString().slice(0, 10);
    await supabase.from("socios").update({ estado: "Inactivo" }).eq("id", socio.id);
    await supabase.from("historial_cambios").insert({ socio_id: socio.id, fecha: hoy, campo: "Estado", anterior: "Activo", nuevo: "Inactivo (baja)" });
    notify(`${socio.nombre} ${socio.apellido} fue dado de baja.`);
    setShowBaja(false);
    await onChanged();
    onBack();
  };

  const reactivar = async () => {
    await supabase.from("socios").update({ estado: "Activo" }).eq("id", socio.id);
    notify(`${socio.nombre} ${socio.apellido} fue reactivado.`);
    await onChanged();
    onBack();
  };

  const registrarPago = async (monto, medio, fecha) => {
    const d = new Date(fecha);
    const mes = d.getMonth() + 1, anio = d.getFullYear();
    const targetId = socio.grupoId ? socios.find((s) => s.grupoId === socio.grupoId && s.esTitular)?.id : socio.id;
    const { error } = await supabase.from("pagos").insert({ socio_id: targetId, mes, anio, monto: Number(monto), medio, fecha });
    if (error) { notify(error.code === "23505" ? "Ese mes ya tiene un pago registrado." : "Error: " + error.message); return; }
    notify("Pago registrado correctamente.");
    setShowPago(false);
    await onChanged();
  };

  const handleFotoChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { notify("La imagen es muy pesada. Probá con una de menos de 3MB."); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      const { error } = await supabase.from("socios").update({ foto_url: reader.result }).eq("id", socio.id);
      if (error) { notify("Error: " + error.message); return; }
      notify("Foto actualizada.");
      await onChanged();
    };
    reader.readAsDataURL(file);
  };
  const quitarFoto = async () => {
    await supabase.from("socios").update({ foto_url: null }).eq("id", socio.id);
    notify("Foto eliminada.");
    await onChanged();
  };

  const pagosOrdenados = [...pagosEfectivos(socio, socios)].sort((a, b) => (a.fecha < b.fecha ? 1 : -1));

  return (
    <div style={{ paddingBottom: 24 }}>
      <TopHeader title={`${socio.nombre} ${socio.apellido}`} subtitle={`N° ${socio.id}`} onBack={onBack} />
      <div className="p-4 flex items-center justify-between">
        <EstadoPill info={info} />
        {socio.estado === "Inactivo" && <span style={{ fontSize: 12, fontWeight: 700, color: COLORS.textMuted }}>DADO DE BAJA</span>}
      </div>

      <div className="px-4">
        <div style={{ background: COLORS.surface, borderRadius: 12, padding: 16 }}>
          <div className="flex items-center gap-3" style={{ marginBottom: 16 }}>
            <div style={{ width: 60, height: 60, borderRadius: 999, overflow: "hidden", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, border: `1px solid ${COLORS.border}` }}>
              {socio.foto ? <img src={socio.foto} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontFamily: DISPLAY_FONT, fontSize: 20, fontWeight: 700, color: COLORS.textMuted }}>{socio.nombre[0]}{socio.apellido[0]}</span>}
            </div>
            {socio.estado === "Activo" && (
              <div>
                <label style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.navy, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
                  <Camera size={14} /> {socio.foto ? "Cambiar foto" : "Agregar foto"}
                  <input type="file" accept="image/*" style={{ display: "none" }} onChange={handleFotoChange} />
                </label>
                {socio.foto && <button onClick={quitarFoto} style={{ fontSize: 11.5, color: COLORS.textMuted, marginTop: 4, background: "none", border: "none" }}>Quitar foto</button>}
              </div>
            )}
          </div>
          <div className="flex items-center justify-between mb-3">
            <span style={{ fontFamily: DISPLAY_FONT, fontSize: 18, fontWeight: 700 }}>Datos del socio</span>
            {socio.estado === "Activo" && (
              <button onClick={() => (editing ? guardar() : setEditing(true))} style={{ color: COLORS.navy, fontSize: 12.5, fontWeight: 700, display: "flex", alignItems: "center", gap: 4, background: "none", border: "none" }}>
                {editing ? <><Check size={14} /> Guardar</> : <><Edit2 size={14} /> Editar</>}
              </button>
            )}
          </div>
          <InfoRow label="DNI" value={editing ? <input style={inputStyle} value={form.dni} onChange={(e) => setForm({ ...form, dni: e.target.value })} /> : socio.dni} />
          <InfoRow label="WhatsApp" value={editing ? <input style={inputStyle} value={form.whatsapp} onChange={(e) => setForm({ ...form, whatsapp: e.target.value })} /> : socio.whatsapp} />
          <InfoRow label="Domicilio" value={editing ? <input style={inputStyle} value={form.domicilio} onChange={(e) => setForm({ ...form, domicilio: e.target.value })} /> : socio.domicilio} />
          <InfoRow label="Fecha de alta" value={editing ? <input type="date" style={inputStyle} value={form.fechaAlta} onChange={(e) => setForm({ ...form, fechaAlta: e.target.value })} /> : formatFechaISO(socio.fechaAlta)} />
          <InfoRow label="Tipo de socio" value={editing ? (
            <select style={inputStyle} value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })}><option>Individual</option><option>Grupal</option><option>Adherente</option></select>
          ) : <TipoBadge tipo={socio.tipo} />} />
          {editing && pasandoAGrupal && (
            <div style={{ background: COLORS.bg, borderRadius: 10, padding: 12, margin: "8px 0" }}>
              <div className="flex gap-2" style={{ marginBottom: 10 }}>
                <button onClick={() => setModoGrupo("nuevo")} style={{ flex: 1, padding: "8px 0", borderRadius: 8, fontWeight: 700, fontSize: 12.5, background: modoGrupo === "nuevo" ? COLORS.navy : COLORS.surface, color: modoGrupo === "nuevo" ? "#fff" : COLORS.text, border: `1px solid ${modoGrupo === "nuevo" ? COLORS.navy : COLORS.border}` }}>Nuevo grupo</button>
                <button onClick={() => setModoGrupo("existente")} style={{ flex: 1, padding: "8px 0", borderRadius: 8, fontWeight: 700, fontSize: 12.5, background: modoGrupo === "existente" ? COLORS.navy : COLORS.surface, color: modoGrupo === "existente" ? "#fff" : COLORS.text, border: `1px solid ${modoGrupo === "existente" ? COLORS.navy : COLORS.border}` }}>Sumar a un grupo</button>
              </div>
              {modoGrupo === "nuevo" ? (
                <Field label="Nombre del grupo (ej: Familia Pérez)"><input style={inputStyle} value={grupoNombreNuevo} onChange={(e) => setGrupoNombreNuevo(e.target.value)} /></Field>
              ) : gruposConLugar.length === 0 ? (
                <div style={{ fontSize: 12.5, color: COLORS.textMuted }}>Todavía no hay ningún grupo con lugar disponible.</div>
              ) : (
                <Field label="Elegir grupo">
                  <select style={inputStyle} value={grupoElegido} onChange={(e) => setGrupoElegido(e.target.value)}>
                    <option value="">Seleccioná un grupo...</option>
                    {gruposConLugar.map((g) => (
                      <option key={g.grupoId} value={g.grupoId}>{g.grupoNombre} ({g.integrantes}/4 integrantes)</option>
                    ))}
                  </select>
                </Field>
              )}
            </div>
          )}
          <InfoRow label="Cuota" value={editing ? <input type="number" style={inputStyle} value={form.cuota} onChange={(e) => setForm({ ...form, cuota: e.target.value })} disabled={pasandoAGrupal} /> : formatMoney(socio.cuota)} last={!editing} />
          {editing && (
            <div style={{ paddingTop: 10 }}>
              <label className="flex items-center gap-2" style={{ fontSize: 13, fontWeight: 600 }}>
                <input type="checkbox" checked={!!form.eximido} onChange={(e) => setForm({ ...form, eximido: e.target.checked })} />
                Eximido de cuota (no se le cobra ni genera deuda)
              </label>
            </div>
          )}
        </div>
      </div>
      {socio.eximido && !editing && (
        <div className="px-4 mt-2">
          <span style={{ background: COLORS.exentoLight, color: COLORS.exento, fontSize: 11.5, fontWeight: 700, padding: "4px 10px", borderRadius: 999 }}>Eximido de cuota</span>
        </div>
      )}

      {integrantes.length > 0 && (
        <div className="px-4 mt-3">
          <div style={{ background: COLORS.surface, borderRadius: 12, padding: 16 }}>
            <div style={{ fontFamily: DISPLAY_FONT, fontSize: 16, fontWeight: 700, marginBottom: 8 }}>{socio.grupoNombre} · Integrantes</div>
            {integrantes.map((it) => (
              <div key={it.id} className="flex items-center justify-between" style={{ padding: "6px 0", fontSize: 13.5 }}>
                <span>{it.nombre} {it.apellido} {it.esTitular ? "(titular)" : ""}</span>
                <span style={{ color: COLORS.textMuted }}>N° {it.id}</span>

        </div>
      )}

      <div className="px-4 mt-3">
        <div style={{ background: COLORS.surface, borderRadius: 12, padding: 16 }}>
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 16, fontWeight: 700, marginBottom: 8 }}>Historial de tipo de socio</div>
          {socio.historialTipo.map((h, i) => (
            <div key={i} style={{ fontSize: 13, padding: "4px 0" }}><TipoBadge tipo={h.tipo} /> <span style={{ color: COLORS.textMuted }}>desde {formatFechaISO(h.desde)}</span></div>
          ))}
        </div>

      {socio.grupoId && !socio.esTitular && titular && (
        <div className="px-4 mt-3" style={{ fontSize: 12, color: COLORS.textMuted }}>
          Los pagos de este grupo se registran a nombre del titular ({titular.nombre} {titular.apellido}).
        </div>
      )}

      <div className="px-4 mt-3 flex items-center justify-between">
        <div style={{ fontFamily: DISPLAY_FONT, fontSize: 16, fontWeight: 700 }}>Historial de pagos</div>
        {socio.estado === "Activo" && <button onClick={() => setShowPago(true)} style={{ color: COLORS.green, fontSize: 12.5, fontWeight: 700, background: "none", border: "none" }}>+ Registrar pago</button>}
      </div>
      <div className="px-4 mt-2">
        <div style={{ background: COLORS.surface, borderRadius: 12, overflow: "hidden" }}>
          {pagosOrdenados.length === 0 && <div className="p-4" style={{ color: COLORS.textMuted, fontSize: 13 }}>Sin pagos registrados.</div>}
          {pagosOrdenados.map((p, i) => (
            <div key={i} className="flex items-center justify-between px-4 py-3" style={{ borderBottom: i < pagosOrdenados.length - 1 ? `1px solid ${COLORS.border}` : "none" }}>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 600 }}>{cap(MESES[p.mes - 1])} {p.anio}</div>
                <div style={{ fontSize: 11.5, color: COLORS.textMuted }}>{p.medio} · {formatFechaISO(p.fecha)}</div>
              </div>
              <div style={{ fontWeight: 700, color: COLORS.navy }}>{formatMoney(p.monto)}</div>
            </div>
          ))}
        </div>
      </div>

      {socio.historialCambios.length > 0 && (
        <div className="px-4 mt-3">
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 16, fontWeight: 700, marginBottom: 8 }}>Historial de modificaciones</div>
          <div style={{ background: COLORS.surface, borderRadius: 12, overflow: "hidden" }}>
            {[...socio.historialCambios].reverse().map((c, i) => (
              <div key={i} className="px-4 py-3" style={{ borderBottom: i < socio.historialCambios.length - 1 ? `1px solid ${COLORS.border}` : "none" }}>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{c.campo}</div>
                <div style={{ fontSize: 12, color: COLORS.textMuted }}>{c.anterior} → {c.nuevo} · {formatFechaISO(c.fecha)}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="px-4 mt-6">
        {socio.estado === "Activo" ? (
          <button onClick={() => setShowBaja(true)} className="w-full" style={{ background: COLORS.redLight, color: COLORS.red, fontWeight: 700, padding: "13px 0", borderRadius: 10, border: "none" }}>Dar de baja</button>
        ) : (
          <button onClick={reactivar} className="w-full" style={{ background: COLORS.greenLight, color: COLORS.green, fontWeight: 700, padding: "13px 0", borderRadius: 10, border: "none" }}>Reactivar socio</button>
        )}
      </div>

      {showBaja && (
        <Modal title="Confirmar baja" onClose={() => setShowBaja(false)}>
          <p style={{ fontSize: 14, color: COLORS.text, marginBottom: 16 }}>¿Confirmás la baja de <b>{socio.nombre} {socio.apellido}</b>? Sus datos no se eliminan, pero dejará de aparecer en el listado de socios activos.</p>
          <div className="flex gap-3">
            <button onClick={() => setShowBaja(false)} className="w-full" style={{ padding: "12px 0", borderRadius: 10, border: `1px solid ${COLORS.border}`, fontWeight: 600, background: "none" }}>Cancelar</button>
            <button onClick={confirmarBaja} className="w-full" style={{ padding: "12px 0", borderRadius: 10, background: COLORS.red, color: "#fff", fontWeight: 700, border: "none" }}>Confirmar baja</button>
          </div>
        </Modal>
      )}
      {showPago && <RegistrarPagoModal cuotaSugerida={socio.cuota} onClose={() => setShowPago(false)} onConfirm={registrarPago} />}
    </div>
  );
}

/* ---------- ADMIN: Socios ---------- */
function AdminSocios({ socios, cuotaConfig, notify, onChanged }) {
  const [selectedId, setSelectedId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [showInactivos, setShowInactivos] = useState(false);
  const [query, setQuery] = useState("");
  const [tipoFiltro, setTipoFiltro] = useState("Todos");

  const selected = socios.find((s) => s.id === selectedId);
  if (selected) return <SocioDetail socio={selected} socios={socios} onBack={() => setSelectedId(null)} notify={notify} onChanged={onChanged} />;

  const base = socios.filter((s) => (showInactivos ? s.estado === "Inactivo" : s.estado === "Activo"));
  const filtrados = base.filter((s) => {
    if (tipoFiltro !== "Todos" && s.tipo !== tipoFiltro) return false;
    if (!query) return true;
    const q = query.toLowerCase();
    return `${s.nombre} ${s.apellido}`.toLowerCase().includes(q) || String(s.id).includes(q) || s.tipo.toLowerCase().includes(q);
  });
  const cantInactivos = socios.filter((s) => s.estado === "Inactivo").length;

  return (
    <div>
      <TopHeader title="Socios" subtitle={`${base.length} ${showInactivos ? "dados de baja" : "activos"}`} />
      <div className="p-4 pb-2">
        <div className="flex items-center gap-2" style={{ background: COLORS.surface, borderRadius: 10, padding: "9px 12px" }}>
          <Search size={17} color={COLORS.textMuted} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar por nombre, N° o tipo" className="w-full" style={{ fontSize: 14, outline: "none", border: "none" }} />
        </div>
        <div className="flex gap-2 mt-3" style={{ overflowX: "auto" }}>
          {["Todos", "Individual", "Grupal", "Adherente"].map((t) => (
            <button key={t} onClick={() => setTipoFiltro(t)} style={{ whiteSpace: "nowrap", fontSize: 12.5, fontWeight: 600, padding: "6px 13px", borderRadius: 999, background: tipoFiltro === t ? COLORS.navy : COLORS.surface, color: tipoFiltro === t ? "#fff" : COLORS.text, border: `1px solid ${tipoFiltro === t ? COLORS.navy : COLORS.border}` }}>
              {t}
            </button>
          ))}
        </div>
      </div>

      <div className="px-4">
        {filtrados.map((s) => {
          const info = estadoCuota(s, socios);
          return (
            <button key={s.id} onClick={() => setSelectedId(s.id)} className="w-full flex items-center justify-between" style={{ background: COLORS.surface, borderRadius: 12, padding: "12px 14px", marginBottom: 8, textAlign: "left", border: "none" }}>
              <div className="flex items-center gap-3" style={{ flex: 1, minWidth: 0 }}>
                <div style={{ width: 36, height: 36, borderRadius: 999, overflow: "hidden", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  {s.foto ? <img src={s.foto} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontFamily: DISPLAY_FONT, fontSize: 13, fontWeight: 700, color: COLORS.textMuted }}>{s.nombre[0]}{s.apellido[0]}</span>}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="flex items-center gap-2">
                    <span style={{ fontSize: 14.5, fontWeight: 700, color: COLORS.text }}>{s.nombre} {s.apellido}</span>
                    <TipoBadge tipo={s.tipo} />
                    {s.eximido && <span style={{ background: COLORS.exentoLight, color: COLORS.exento, fontSize: 10.5, fontWeight: 700, padding: "2px 7px", borderRadius: 999 }}>Eximido</span>}
                  </div>
                  <div style={{ fontSize: 12, color: COLORS.textMuted, marginTop: 3 }}>N° {s.id}{s.grupoNombre ? ` · ${s.grupoNombre}` : ""}</div>
                </div>
              </div>
              <div className="flex items-center gap-2" style={{ flexShrink: 0 }}>
                <span style={{ width: 9, height: 9, borderRadius: 999, background: info.color }} />
                <ChevronRight size={18} color={COLORS.textMuted} />
              </div>
            </button>
          );
        })}
        {filtrados.length === 0 && <div style={{ color: COLORS.textMuted, fontSize: 13.5, textAlign: "center", padding: "30px 0" }}>No se encontraron socios.</div>}
      </div>

      <div className="px-4 pb-4 pt-2 flex justify-center">
        <button onClick={() => setShowInactivos(!showInactivos)} style={{ color: COLORS.navy, fontSize: 12.5, fontWeight: 600, background: "none", border: "none" }}>
          {showInactivos ? "← Ver socios activos" : `Ver socios dados de baja (${cantInactivos})`}
        </button>
      </div>

      {!showInactivos && (
        <button onClick={() => setShowNew(true)} style={{ position: "fixed", right: 20, bottom: 92, background: COLORS.gold, color: COLORS.navyDark, width: 54, height: 54, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 8px 18px rgba(0,0,0,0.25)", border: "none" }}>
          <Plus size={26} strokeWidth={2.6} />
        </button>
      )}
      {showNew && <NuevoSocioModal socios={socios} cuotaConfig={cuotaConfig} onClose={() => setShowNew(false)} notify={notify} onChanged={onChanged} />}
    </div>
  );
}

/* ---------- ADMIN: Reporte ---------- */
function ReporteModal({ socios, onClose, notify }) {
  const [tipo, setTipo] = useState("Mensual");
  const [mes, setMes] = useState(CURRENT_MONTH);
  const [anio, setAnio] = useState(CURRENT_YEAR);
  const [trimestre, setTrimestre] = useState(1);
  const [resultado, setResultado] = useState(null);

  const generar = () => {
    let meses = [];
    if (tipo === "Mensual") meses = [{ mes, anio }];
    if (tipo === "Trimestral") { const startMes = (trimestre - 1) * 3 + 1; meses = [0, 1, 2].map((i) => shiftMonth(startMes, anio, i)); }
    if (tipo === "Anual") meses = Array.from({ length: 12 }, (_, i) => ({ mes: i + 1, anio }));
    const set = new Set(meses.map((m) => `${m.anio}-${m.mes}`));
    let total = 0, cantidad = 0;
    const porTipo = { Individual: 0, Grupal: 0, Adherente: 0 };
    socios.forEach((s) => {
      if (s.tipo === "Grupal" && !s.esTitular) return;
      s.pagos.forEach((p) => { if (set.has(`${p.anio}-${p.mes}`)) { total += p.monto; cantidad += 1; porTipo[s.tipo] += p.monto; } });
    });
    setResultado({ total, cantidad, porTipo });
  };

  return (
    <Modal title="Generar reporte" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <Field label="Período">
          <select style={inputStyle} value={tipo} onChange={(e) => { setTipo(e.target.value); setResultado(null); }}><option>Mensual</option><option>Trimestral</option><option>Anual</option></select>
        </Field>
        {tipo === "Mensual" && (
          <div className="flex gap-3">
            <Field label="Mes"><select style={inputStyle} value={mes} onChange={(e) => setMes(Number(e.target.value))}>{MESES.map((m, i) => <option key={i} value={i + 1}>{cap(m)}</option>)}</select></Field>
            <Field label="Año"><input type="number" style={inputStyle} value={anio} onChange={(e) => setAnio(Number(e.target.value))} /></Field>
          </div>
        )}
        {tipo === "Trimestral" && (
          <div className="flex gap-3">
            <Field label="Trimestre">
              <select style={inputStyle} value={trimestre} onChange={(e) => setTrimestre(Number(e.target.value))}>
                <option value={1}>1° (Ene-Mar)</option><option value={2}>2° (Abr-Jun)</option><option value={3}>3° (Jul-Sep)</option><option value={4}>4° (Oct-Dic)</option>
              </select>
            </Field>
            <Field label="Año"><input type="number" style={inputStyle} value={anio} onChange={(e) => setAnio(Number(e.target.value))} /></Field>
          </div>
        )}
        {tipo === "Anual" && <Field label="Año"><input type="number" style={inputStyle} value={anio} onChange={(e) => setAnio(Number(e.target.value))} /></Field>}
        <button onClick={generar} style={{ background: COLORS.navy, color: "#fff", fontWeight: 700, padding: "12px 0", borderRadius: 10, border: "none" }}>Generar</button>

        {resultado && (
          <div style={{ background: COLORS.bg, borderRadius: 12, padding: 14, marginTop: 4 }}>
            <div style={{ fontSize: 12.5, color: COLORS.textMuted }}>Total recaudado</div>
            <div style={{ fontFamily: DISPLAY_FONT, fontSize: 28, fontWeight: 700, color: COLORS.navy }}>{formatMoney(resultado.total)}</div>
            <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginTop: 4 }}>{resultado.cantidad} pagos registrados</div>
            <div style={{ height: 1, background: COLORS.border, margin: "10px 0" }} />
            {Object.entries(resultado.porTipo).map(([k, v]) => (
              <div key={k} className="flex items-center justify-between" style={{ fontSize: 13, padding: "3px 0" }}><span>{k}</span><span style={{ fontWeight: 700 }}>{formatMoney(v)}</span></div>
            ))}
            <button onClick={() => notify("La exportación a PDF va a estar disponible en una próxima versión.")} className="w-full" style={{ marginTop: 12, padding: "10px 0", borderRadius: 8, border: `1px solid ${COLORS.navy}`, color: COLORS.navy, fontWeight: 700, fontSize: 13, background: "none" }}>
              Descargar PDF
            </button>
          </div>
        )}
      </div>
    </Modal>
  );
}

/* ---------- ADMIN: Pagos ---------- */
function AdminPagos({ socios, notify, onChanged }) {
  const [mes, setMes] = useState(CURRENT_MONTH);
  const [anio, setAnio] = useState(CURRENT_YEAR);
  const [query, setQuery] = useState("");
  const [pagoTarget, setPagoTarget] = useState(null);
  const [showReporte, setShowReporte] = useState(false);

  const activos = socios.filter((s) => s.estado === "Activo");
  const relevantes = (s) => (s.tipo !== "Grupal" || s.esTitular) && !s.eximido;
  const cambiarMes = (delta) => { const r = shiftMonth(mes, anio, delta); setMes(r.mes); setAnio(r.anio); };
  const matchQuery = (s) => {
    if (!query) return true;
    const q = query.toLowerCase();
    return `${s.nombre} ${s.apellido}`.toLowerCase().includes(q) || String(s.id).includes(q) || s.tipo.toLowerCase().includes(q);
  };

  const pagados = [];
  const pendientes = [];
  activos.filter(relevantes).filter(matchQuery).forEach((s) => {
    const pagos = pagosEfectivos(s, socios);
    const pago = pagos.find((p) => p.mes === mes && p.anio === anio);
    const yaEraSocio = new Date(s.fechaAlta) <= new Date(anio, mes - 1, 28);
    if (!yaEraSocio) return;
    if (pago) pagados.push({ socio: s, pago }); else pendientes.push(s);
  });
  const cobrado = pagados.reduce((acc, p) => acc + p.pago.monto, 0);
  const pendienteMonto = pendientes.reduce((acc, s) => acc + s.cuota, 0);
  const deudores = activos.filter(relevantes).filter(matchQuery).map((s) => ({ s, info: estadoCuota(s, socios) })).filter((x) => x.info.estado === "Deudor");

  const registrarPago = async (socio, monto, medio, fecha) => {
    const targetId = socio.grupoId ? socios.find((x) => x.grupoId === socio.grupoId && x.esTitular)?.id : socio.id;
    const { error } = await supabase.from("pagos").insert({ socio_id: targetId, mes, anio, monto: Number(monto), medio, fecha });
    if (error) { notify(error.code === "23505" ? "Ese mes ya tiene un pago registrado." : "Error: " + error.message); return; }
    notify("Pago registrado.");
    setPagoTarget(null);
    await onChanged();
  };

  return (
    <div style={{ paddingBottom: 12 }}>
      <TopHeader title="Pagos" right={<button onClick={() => setShowReporte(true)} style={{ color: "#fff", background: "none", border: "none" }}><FileText size={20} /></button>} />
      <div className="p-4 pb-2 flex items-center justify-center gap-4">
        <button onClick={() => cambiarMes(-1)} style={{ background: "none", border: "none" }}><ChevronLeft color={COLORS.navy} /></button>
        <span style={{ fontFamily: DISPLAY_FONT, fontSize: 19, fontWeight: 700 }}>{cap(MESES[mes - 1])} {anio}</span>
        <button onClick={() => cambiarMes(1)} style={{ background: "none", border: "none" }}><ChevronRight color={COLORS.navy} /></button>
      </div>
      <div className="px-4 pb-3">
        <div className="flex items-center gap-2" style={{ background: COLORS.surface, borderRadius: 10, padding: "9px 12px" }}>
          <Search size={17} color={COLORS.textMuted} />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar socio, N° o tipo" className="w-full" style={{ fontSize: 14, outline: "none", border: "none" }} />
        </div>
      </div>
      <div className="px-4 grid grid-cols-2 gap-3 mb-2">
        <div style={{ background: COLORS.greenLight, borderRadius: 12, padding: 14 }}>
          <div style={{ fontSize: 11.5, color: COLORS.green, fontWeight: 700 }}>COBRADO EN EL MES</div>
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 24, fontWeight: 700, color: COLORS.green }}>{formatMoney(cobrado)}</div>
        </div>
        <div style={{ background: COLORS.amberLight, borderRadius: 12, padding: 14 }}>
          <div style={{ fontSize: 11.5, color: COLORS.amber, fontWeight: 700 }}>PENDIENTE DEL MES</div>
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 24, fontWeight: 700, color: COLORS.amber }}>{formatMoney(pendienteMonto)}</div>
        </div>
      </div>

      <div className="px-4 mt-2">
        <div style={{ fontFamily: DISPLAY_FONT, fontSize: 16, fontWeight: 700, marginBottom: 6 }}>Pagos registrados</div>
        <div style={{ background: COLORS.surface, borderRadius: 12, overflow: "hidden", marginBottom: 16 }}>
          {pagados.length === 0 && <div className="p-4" style={{ color: COLORS.textMuted, fontSize: 13 }}>Sin pagos este mes todavía.</div>}
          {pagados.map(({ socio, pago }, i) => (
            <div key={socio.id} className="flex items-center justify-between px-4 py-3" style={{ borderBottom: i < pagados.length - 1 ? `1px solid ${COLORS.border}` : "none" }}>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 600 }}>{socio.tipo === "Grupal" ? socio.grupoNombre : `${socio.nombre} ${socio.apellido}`}</div>
                <div style={{ fontSize: 11.5, color: COLORS.textMuted }}>N° {socio.id} · {pago.medio}</div>
              </div>
              <div style={{ fontWeight: 700, color: COLORS.navy }}>{formatMoney(pago.monto)}</div>
            </div>
          ))}
        </div>

        <div style={{ fontFamily: DISPLAY_FONT, fontSize: 16, fontWeight: 700, marginBottom: 6 }}>Pendientes del mes</div>
        <div style={{ background: COLORS.surface, borderRadius: 12, overflow: "hidden", marginBottom: 16 }}>
          {pendientes.length === 0 && <div className="p-4" style={{ color: COLORS.textMuted, fontSize: 13 }}>No hay pagos pendientes. 🎉</div>}
          {pendientes.map((s, i) => (
            <div key={s.id} className="flex items-center justify-between px-4 py-3" style={{ borderBottom: i < pendientes.length - 1 ? `1px solid ${COLORS.border}` : "none" }}>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 600 }}>{s.tipo === "Grupal" ? s.grupoNombre : `${s.nombre} ${s.apellido}`}</div>
                <div style={{ fontSize: 11.5, color: COLORS.textMuted }}>N° {s.id} · {formatMoney(s.cuota)}</div>
              </div>
              <button onClick={() => setPagoTarget(s)} style={{ fontSize: 12, fontWeight: 700, color: COLORS.navy, border: `1px solid ${COLORS.navy}`, borderRadius: 8, padding: "6px 10px", background: "none" }}>Registrar</button>
            </div>
          ))}
        </div>

        <div style={{ fontFamily: DISPLAY_FONT, fontSize: 16, fontWeight: 700, marginBottom: 6 }}>Deudas (meses anteriores)</div>
        <div style={{ background: COLORS.surface, borderRadius: 12, overflow: "hidden" }}>
          {deudores.length === 0 && <div className="p-4" style={{ color: COLORS.textMuted, fontSize: 13 }}>No hay deudas registradas.</div>}
          {deudores.map(({ s, info }, i) => (
            <div key={s.id} className="flex items-center justify-between px-4 py-3" style={{ borderBottom: i < deudores.length - 1 ? `1px solid ${COLORS.border}` : "none" }}>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 600 }}>{s.tipo === "Grupal" ? s.grupoNombre : `${s.nombre} ${s.apellido}`}</div>
                <div style={{ fontSize: 11.5, color: COLORS.red }}>{info.meses} {info.meses === 1 ? "mes adeudado" : "meses adeudados"}</div>
                <div style={{ fontSize: 11, color: COLORS.textMuted }}>{formatMesesLista(info.mesesLista)}</div>
              </div>
              <div style={{ fontWeight: 700, color: COLORS.red }}>{formatMoney(info.meses * s.cuota)}</div>
            </div>
          ))}
        </div>
      </div>

      {pagoTarget && <RegistrarPagoModal cuotaSugerida={pagoTarget.cuota} onClose={() => setPagoTarget(null)} onConfirm={(monto, medio, fecha) => registrarPago(pagoTarget, monto, medio, fecha)} />}
      {showReporte && <ReporteModal socios={socios} onClose={() => setShowReporte(false)} notify={notify} />}
    </div>
  );
}

/* ---------- ADMIN: Configuración ---------- */
function AddAdminModal({ onClose, notify, onChanged }) {
  const [uid, setUid] = useState("");
  const [nombre, setNombre] = useState("");
  const [guardando, setGuardando] = useState(false);

  const agregar = async () => {
    if (!uid || !nombre) { notify("Completá el UID y el nombre."); return; }
    setGuardando(true);
    const { error } = await supabase.from("perfiles").insert({ user_id: uid, rol: "admin", nombre });
    setGuardando(false);
    if (error) { notify("Error: " + error.message); return; }
    notify("Administrador agregado.");
    await onChanged();
    onClose();
  };

  return (
    <Modal title="Agregar administrador" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <div style={{ fontSize: 12, color: COLORS.textMuted }}>
          Primero creá el login en Supabase → Authentication → Users → "Add user", con el mail y contraseña de la nueva persona. Después pegá acá su UID (columna "UID" en esa misma lista).
        </div>

function AdminConfig({ cuotaConfig, adminUsers, notify, onChanged }) {
  const [cuotas, setCuotas] = useState(cuotaConfig);
  const [showAddAdmin, setShowAddAdmin] = useState(false);
  const [pwd, setPwd] = useState({ nueva: "", confirmar: "" });

  useEffect(() => { setCuotas(cuotaConfig); }, [cuotaConfig]);

  const guardarCuotas = async () => {
    await Promise.all(["Adherente", "Individual", "Grupal"].map((t) =>
      supabase.from("cuota_config").update({ valor: Number(cuotas[t]), actualizado_en: new Date().toISOString() }).eq("tipo", t)
    ));
    notify("Valores de cuota actualizados. Aplican desde el próximo mes.");
    await onChanged();
  };

  const cambiarPassword = async () => {
    if (!pwd.nueva || pwd.nueva !== pwd.confirmar) { notify("Las contraseñas nuevas no coinciden."); return; }
    const { error } = await supabase.auth.updateUser({ password: pwd.nueva });
    if (error) { notify("Error: " + error.message); return; }
    notify("Contraseña actualizada.");
    setPwd({ nueva: "", confirmar: "" });
  };

  return (
    <div style={{ paddingBottom: 24 }}>
      <TopHeader title="Configuración" />
      <div className="p-4 flex flex-col gap-4">
        <Section title="Seguridad" icon={KeyRound}>
          <Field label="Nueva contraseña"><input type="password" style={inputStyle} value={pwd.nueva} onChange={(e) => setPwd({ ...pwd, nueva: e.target.value })} /></Field>
          <Field label="Confirmar nueva contraseña"><input type="password" style={inputStyle} value={pwd.confirmar} onChange={(e) => setPwd({ ...pwd, confirmar: e.target.value })} /></Field>
          <button onClick={cambiarPassword} style={{ background: COLORS.navy, color: "#fff", fontWeight: 700, padding: "11px 0", borderRadius: 10, border: "none", marginTop: 4 }}>Actualizar contraseña</button>
        </Section>

        <Section title="Usuarios administradores" icon={ShieldCheck}>
          {adminUsers.map((u) => (
            <div key={u.id} className="flex items-center justify-between" style={{ padding: "7px 0" }}>
              <span style={{ fontSize: 13.5 }}>{u.nombre}</span>
            </div>
          ))}
          <button onClick={() => setShowAddAdmin(true)} style={{ color: COLORS.navy, fontSize: 13, fontWeight: 700, marginTop: 6, display: "flex", alignItems: "center", gap: 5, background: "none", border: "none" }}>
            <UserPlus size={15} /> Agregar administrador
          </button>
        </Section>

        <Section title="Valores de cuota" icon={DollarSign}>
          {["Adherente", "Individual", "Grupal"].map((t) => (
            <Field key={t} label={t}><input type="number" style={inputStyle} value={cuotas[t]} onChange={(e) => setCuotas({ ...cuotas, [t]: e.target.value })} /></Field>
          ))}
          <button onClick={guardarCuotas} style={{ background: COLORS.navy, color: "#fff", fontWeight: 700, padding: "11px 0", borderRadius: 10, border: "none", marginTop: 4 }}>Guardar cambios</button>
        </Section>
      </div>
      {showAddAdmin && <AddAdminModal onClose={() => setShowAddAdmin(false)} notify={notify} onChanged={onChanged} />}
    </div>
  );
}

function ComponerNotifModal({ socios, onClose, notify, onChanged }) {
  const [destinoTodos, setDestinoTodos] = useState(true);
  const [seleccionados, setSeleccionados] = useState([]);
  const [mensaje, setMensaje] = useState("");
  const activos = socios.filter((s) => s.estado === "Activo");
  const toggle = (id) => setSeleccionados(seleccionados.includes(id) ? seleccionados.filter((x) => x !== id) : [...seleccionados, id]);

  const enviar = async () => {
    if (!mensaje) return;
    const { error } = await supabase.from("notificaciones").insert({ destinatarios: destinoTodos ? "todos" : seleccionados, mensaje });
    if (error) { notify("Error: " + error.message); return; }
    notify(`Notificación enviada a ${destinoTodos ? "todos los socios" : seleccionados.length + " socio(s)"}.`);
    await onChanged();
    onClose();
  };

  return (
    <Modal title="Enviar notificación" onClose={onClose}>
      <div className="flex flex-col gap-3">
        <div className="flex gap-2">
          <button onClick={() => setDestinoTodos(true)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, fontWeight: 700, fontSize: 13, background: destinoTodos ? COLORS.navy : COLORS.bg, color: destinoTodos ? "#fff" : COLORS.text, border: "none" }}>Todos</button>
          <button onClick={() => setDestinoTodos(false)} style={{ flex: 1, padding: "9px 0", borderRadius: 8, fontWeight: 700, fontSize: 13, background: !destinoTodos ? COLORS.navy : COLORS.bg, color: !destinoTodos ? "#fff" : COLORS.text, border: "none" }}>Elegir socios</button>
        </div>
        {!destinoTodos && (
          <div style={{ maxHeight: 180, overflowY: "auto", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: 8 }}>
            {activos.map((s) => (
              <label key={s.id} className="flex items-center gap-2" style={{ fontSize: 13, padding: "5px 0" }}>
                <input type="checkbox" checked={seleccionados.includes(s.id)} onChange={() => toggle(s.id)} /> {s.nombre} {s.apellido} (N° {s.id})
              </label>
            ))}
          </div>
        )}
        <Field label="Mensaje"><textarea style={{ ...inputStyle, minHeight: 80 }} value={mensaje} onChange={(e) => setMensaje(e.target.value)} /></Field>
        <button onClick={enviar} style={{ background: COLORS.green, color: "#fff", fontWeight: 700, padding: "12px 0", borderRadius: 10, border: "none" }}>Enviar notificación</button>
      </div>
    </Modal>
  );
}

function UserPagos({ socio, socios, notify, onChanged }) {
  const info = estadoCuota(socio, socios);
  const [showMP, setShowMP] = useState(false);
  const [pagando, setPagando] = useState(false);

  const pagarMesActual = async () => {
    setPagando(true);
    const fecha = new Date().toISOString().slice(0, 10);
    const targetId = socio.grupoId ? socios.find((s) => s.grupoId === socio.grupoId && s.esTitular)?.id : socio.id;
    const { error } = await supabase.from("pagos").insert({ socio_id: targetId, mes: CURRENT_MONTH, anio: CURRENT_YEAR, monto: socio.cuota, medio: "Mercado Pago", fecha });
    setPagando(false);
    setShowMP(false);
    if (error) { notify(error.code === "23505" ? "Ya hay un pago registrado este mes." : "Error: " + error.message); return; }
    notify("¡Pago acreditado! Gracias.");
    await onChanged();
  };

  return (
    <div style={{ paddingBottom: 20 }}>
      <TopHeader title="Pagos" />
      <div className="p-4">
        <div style={{ background: COLORS.surface, borderRadius: 14, padding: 18 }}>
          <div style={{ fontSize: 12.5, color: COLORS.textMuted }}>Cuota de {cap(MESES[CURRENT_MONTH - 1])}</div>
          <div style={{ fontFamily: DISPLAY_FONT, fontSize: 32, fontWeight: 700, color: COLORS.text, marginTop: 2 }}>{formatMoney(socio.cuota)}</div>
          <div style={{ marginTop: 8 }}><EstadoPill info={info} /></div>
          {info.estado === "Eximido" ? (
            <div style={{ background: COLORS.exentoLight, color: COLORS.exento, borderRadius: 10, padding: "12px 14px", marginTop: 16, fontSize: 13 }}>
              Estás eximido del pago de la cuota. ¡Gracias por tu colaboración con el club!
            </div>
          ) : (
            <button onClick={() => setShowMP(true)} className="w-full flex items-center justify-center gap-2" style={{ background: "#009EE3", color: "#fff", fontWeight: 700, padding: "13px 0", borderRadius: 10, marginTop: 16, fontSize: 14.5, border: "none" }}>
              <Wallet size={18} /> Pagar con Mercado Pago
            </button>
          )}
        </div>

        {info.estado === "Deudor" && (
          <div style={{ background: COLORS.surface, borderRadius: 14, padding: 18, marginTop: 14 }}>
            <div style={{ fontFamily: DISPLAY_FONT, fontSize: 17, fontWeight: 700, color: COLORS.red, marginBottom: 6 }}>Meses adeudados</div>
            <div style={{ fontSize: 13.5, color: COLORS.text }}>{info.meses} {info.meses === 1 ? "mes" : "meses"} sin abonar</div>
            <div style={{ fontSize: 12.5, color: COLORS.textMuted, marginTop: 2 }}>{formatMesesLista(info.mesesLista)}</div>
            <div style={{ fontFamily: DISPLAY_FONT, fontSize: 22, fontWeight: 700, color: COLORS.red, marginTop: 4 }}>{formatMoney(info.meses * socio.cuota)}</div>
          </div>
        )}
      </div>

      {showMP && (
        <Modal title="Mercado Pago" onClose={() => !pagando && setShowMP(false)}>
          <div style={{ textAlign: "center", padding: "10px 0" }}>
            <Wallet size={40} color="#009EE3" style={{ margin: "0 auto 12px" }} />
            {!pagando ? (
              <>
                <p style={{ fontSize: 13.5, color: COLORS.text, marginBottom: 16 }}>Vas a pagar {formatMoney(socio.cuota)} correspondiente a este mes.</p>
                <button onClick={pagarMesActual} className="w-full" style={{ background: "#009EE3", color: "#fff", fontWeight: 700, padding: "12px 0", borderRadius: 10, border: "none" }}>Confirmar pago</button>
                <div style={{ fontSize: 11, color: COLORS.textMuted, marginTop: 10 }}>Por ahora el pago se simula (todavía no está conectado el checkout real de Mercado Pago).</div>
              </>
            ) : <p style={{ fontSize: 13.5, color: COLORS.textMuted }}>Procesando pago…</p>}
          </div>
        </Modal>
      )}
    </div>
  );
}

function UserConfig({ socio, notify, onChanged }) {
  const [pwd, setPwd] = useState({ nueva: "", confirmar: "" });
  const [nuevoDomicilio, setNuevoDomicilio] = useState("");

  const cambiarPassword = async () => {
    if (!pwd.nueva || pwd.nueva !== pwd.confirmar) { notify("Las contraseñas nuevas no coinciden."); return; }
    const { error } = await supabase.auth.updateUser({ password: pwd.nueva });
    if (error) { notify("Error: " + error.message); return; }
    notify("Contraseña actualizada.");
    setPwd({ nueva: "", confirmar: "" });
  };
  const enviarSolicitud = async () => {
    if (!nuevoDomicilio) return;
    const { error } = await supabase.from("solicitudes_domicilio").insert({ socio_id: socio.id, nuevo_domicilio: nuevoDomicilio });
    if (error) { notify("Error: " + error.message); return; }
    setNuevoDomicilio("");
    notify("Solicitud enviada. El administrador la va a revisar.");
    await onChanged();
  };

  return (
    <div style={{ paddingBottom: 24 }}>
      <TopHeader title="Configuración" />
      <div className="p-4 flex flex-col gap-4">
        <Section title="Seguridad" icon={KeyRound}>
          <Field label="Nueva contraseña"><input type="password" style={inputStyle} value={pwd.nueva} onChange={(e) => setPwd({ ...pwd, nueva: e.target.value })} /></Field>
          <Field label="Confirmar nueva contraseña"><input type="password" style={inputStyle} value={pwd.confirmar} onChange={(e) => setPwd({ ...pwd, confirmar: e.target.value })} /></Field>
          <button onClick={cambiarPassword} style={{ background: COLORS.navy, color: "#fff", fontWeight: 700, padding: "11px 0", borderRadius: 10, border: "none" }}>Actualizar contraseña</button>
        </Section>
        <Section title="Solicitar cambio de domicilio" icon={MapPin}>
          <div style={{ fontSize: 12, color: COLORS.textMuted }}>Domicilio actual: {socio.domicilio || "-"}</div>
          <Field label="Nuevo domicilio"><input style={inputStyle} value={nuevoDomicilio} onChange={(e) => setNuevoDomicilio(e.target.value)} /></Field>
          <button onClick={enviarSolicitud} style={{ background: COLORS.green, color: "#fff", fontWeight: 700, padding: "11px 0", borderRadius: 10, border: "none" }}>Enviar solicitud</button>

function App() {
  const [session, setSession] = useState(null);
  const [perfil, setPerfil] = useState(null);
  const [cargandoSesion, setCargandoSesion] = useState(true);
  const [datosListos, setDatosListos] = useState(false);
  const [socios, setSocios] = useState([]);
  const [cuotaConfig, setCuotaConfig] = useState({ Adherente: 0, Individual: 0, Grupal: 0 });
  const [adminUsers, setAdminUsers] = useState([]);
  const [solicitudes, setSolicitudes] = useState([]);
  const [notificaciones, setNotificaciones] = useState([]);
  const [toast, setToast] = useState("");

  const notify = (msg) => setToast(msg);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2600);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => { setSession(data.session); setCargandoSesion(false); });
    const { data: sub } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  const cargarPerfil = async (sess) => {
    const s = sess || session;
    if (!s) { setPerfil(null); return; }
    const { data } = await supabase.from("perfiles").select("*").eq("user_id", s.user.id).maybeSingle();
    setPerfil(data || null);
    if (data) await recargarDatos();
  };

  useEffect(() => { if (session) cargarPerfil(session); else { setPerfil(null); setDatosListos(false); } }, [session]);

  const recargarDatos = async () => {
    const [sociosRes, pagosRes, tipoRes, cambiosRes, cuotaRes, adminsRes, solicRes, notifRes] = await Promise.all([
      supabase.from("socios").select("*").order("id"),
      supabase.from("pagos").select("*"),
      supabase.from("historial_tipo").select("*"),
      supabase.from("historial_cambios").select("*"),
      supabase.from("cuota_config").select("*"),
      supabase.from("perfiles").select("*").eq("rol", "admin"),
      supabase.from("solicitudes_domicilio").select("*").eq("estado", "Pendiente"),
      supabase.from("notificaciones").select("*").order("fecha", { ascending: false }),
    ]);

    const sociosMapeados = (sociosRes.data || []).map(mapSocioRow);
    const porId = Object.fromEntries(sociosMapeados.map((s) => [s.id, s]));
    (tipoRes.data || []).forEach((r) => { if (porId[r.socio_id]) porId[r.socio_id].historialTipo.push({ tipo: r.tipo, desde: r.desde }); });
    (cambiosRes.data || []).forEach((r) => { if (porId[r.socio_id]) porId[r.socio_id].historialCambios.push({ fecha: r.fecha, campo: r.campo, anterior: r.anterior, nuevo: r.nuevo }); });
    (pagosRes.data || []).forEach((r) => { if (porId[r.socio_id]) porId[r.socio_id].pagos.push({ mes: r.mes, anio: r.anio, monto: Number(r.monto), medio: r.medio, fecha: r.fecha }); });
    Object.values(porId).forEach((s) => { s.historialTipo.sort((a, b) => (a.desde < b.desde ? -1 : 1)); s.historialCambios.sort((a, b) => (a.fecha < b.fecha ? -1 : 1)); });

    setSocios(sociosMapeados);

    const cc = { Adherente: 0, Individual: 0, Grupal: 0 };
    (cuotaRes.data || []).forEach((r) => { cc[r.tipo] = Number(r.valor); });
    setCuotaConfig(cc);

    setAdminUsers((adminsRes.data || []).map((a) => ({ id: a.user_id, nombre: a.nombre || "Administrador" })));

    setSolicitudes((solicRes.data || []).map((s) => {
      const soc = sociosMapeados.find((x) => x.id === s.socio_id);
      return { id: s.id, nombreSocio: soc ? `${soc.nombre} ${soc.apellido}` : `Socio N° ${s.socio_id}`, nuevoDomicilio: s.nuevo_domicilio };
    }));

    setNotificaciones((notifRes.data || []).map((n) => ({ id: n.id, destinatarios: n.destinatarios, mensaje: n.mensaje, fecha: n.fecha })));
    setDatosListos(true);
  };

  const salir = async () => { await supabase.auth.signOut(); setPerfil(null); setDatosListos(false); };

  if (cargandoSesion) return <PantallaCarga />;
  if (!session) return (<div style={{ fontFamily: BODY_FONT }}><ToastBar text={toast} /><LoginScreen notify={notify} /></div>);
  if (!perfil) return (<div style={{ fontFamily: BODY_FONT }}><ToastBar text={toast} /><VincularScreen onVinculado={() => cargarPerfil(session)} onSalir={salir} notify={notify} /></div>);
  if (!datosListos) return <PantallaCarga />;

  const data = { socios, cuotaConfig, adminUsers, solicitudes, notificaciones };

  return (
    <div style={{ fontFamily: BODY_FONT }}>
      <ToastBar text={toast} />
      {perfil.rol === "admin" ? (
        <AdminShell data={data} notify={notify} onChanged={recargarDatos} onExit={salir} />
      ) : perfil.rol === "socio" ? (
        <UserShell socio={socios.find((s) => s.id === perfil.socio_id)} data={data} notify={notify} onChanged={recargarDatos} onExit={salir} />
      ) : (
        <SinAcceso onExit={salir} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
